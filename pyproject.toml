[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-fix-agent"
version = "0.1.0"
description = "A test-driven autonomous coding agent with auditable evaluation."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Tsukishiro-Hitomi"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "anthropic==0.117.0",
  "python-dotenv==1.2.1",
  "pytest==8.4.2",
]

[project.optional-dependencies]
dev = ["build==1.2.2.post1"]
retrieval = ["sentence-transformers==5.1.2"]

[project.scripts]
luna = "cli:main"

[project.urls]
Repository = "https://github.com/Tsukishiro-Hitomi/Luna"

[tool.setuptools]
py-modules = ["cli", "serve", "web_backend"]

[tool.setuptools.packages.find]
include = ["agent*", "eval*"]
